<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Model inspector</title>
    <style>html,body{margin:0;height:100%;background:#15171f;overflow:hidden}
    #hud{position:fixed;top:8px;left:8px;color:#9fb;font:12px ui-monospace;z-index:2}</style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module">
      // Dev-only rig inspector: `?model=sam&view=hands`. Not part of the game.
      import * as THREE from "three";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

      const q = new URLSearchParams(location.search);
      const id = q.get("model") ?? "sam";
      const view = q.get("view") ?? "full";

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#15171f");
      scene.add(new THREE.AmbientLight(0xffffff, 1.6));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(2, 4, 3);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x88aaff, 1.0);
      fill.position.set(-3, 2, -2);
      scene.add(fill);

      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);

      new GLTFLoader().load(`/models/${id}.glb`, (gltf) => {
        const root = gltf.scene;
        scene.add(root);
        root.updateWorldMatrix(true, true);

        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const scale = 1.75 / size.y;
        root.scale.setScalar(scale);
        root.updateWorldMatrix(true, true);

        const bones = {};
        root.traverse((o) => { if (o.name) bones[o.name.toLowerCase().replace(/[^a-z0-9]/g, "")] = o; });

        const focusOn = (names, pad) => {
          const target = new THREE.Vector3();
          let n = 0;
          for (const nm of names) {
            const b = bones[nm];
            if (!b) continue;
            target.add(b.getWorldPosition(new THREE.Vector3()));
            n++;
          }
          if (!n) return null;
          target.divideScalar(n);
          camera.position.set(target.x + pad * 0.8, target.y + pad * 0.35, target.z + pad);
          camera.lookAt(target);
          return target;
        };

        let focused = null;
        const pad = Number(q.get("pad") ?? 0);
        if (view === "hands") focused = focusOn(["mixamorigrighthand", "mixamoriglefthand"], pad || 1.1);
        else if (view === "head") focused = focusOn(["mixamorighead"], pad || 0.9);
        if (!focused) {
          const c = box.getCenter(new THREE.Vector3()).multiplyScalar(scale);
          camera.position.set(c.x + 1.2, c.y + 0.6, c.z + 2.2);
          camera.lookAt(c);
        }

        let tris = 0;
        root.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) tris += (o.geometry.index?.count ?? 0) / 3; });
        document.getElementById("hud").textContent =
          `${id} · ${tris.toFixed(0)} tris · view=${view} · bones=${Object.keys(bones).length}`;
        renderer.render(scene, camera);
        window.__ready = true;
      });

      addEventListener("resize", () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });
      setInterval(() => renderer.render(scene, camera), 100);
    </script>
  </body>
</html>
